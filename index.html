<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sài Gòn Cá Cảnh — Trợ Lý AI 🐟</title>
  <meta name="description" content="Hỏi AI về cá cảnh, kỹ thuật nuôi hồ, bệnh cá, sản phẩm từ Sài Gòn Cá Cảnh TP.HCM" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style-extra.css" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- ═══ OCEAN BACKGROUND ═══ -->
<div class="ocean-bg">
  <div class="bubbles" id="bubbles"></div>
  <div class="fish-container" id="fish-container"></div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div class="app-wrapper" id="app-wrapper" style="display:flex">

  <header class="chat-header" style="justify-content:center; padding: 12px; flex-direction:column; align-items:center; text-align:center;">
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="bot-avatar" style="width:28px;height:28px;font-size:16px;">🐟</div>
      <div class="bot-name" style="font-size:16px;">Sài Gòn Cá Cảnh</div>
    </div>
    <div style="font-size:11px; color:rgba(255,255,255,0.7); margin-top:4px;">
      📍 246 Hồ Văn Huê, Phường Đức Nhuận
    </div>
  </header>

  <!-- USER INFO BAR (hiện sau khi đăng nhập) -->
  <div class="user-bar" id="user-bar" style="display:none">
    <div class="user-bar-inner">
      <img id="user-avatar" src="" alt="" />
      <span id="user-name-bar">Thành viên</span>
      <span class="member-badge">✓ Thành viên</span>
      <button onclick="signOut()" class="btn-signout">Đăng xuất</button>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages-area" id="messages-area">
    <!-- populated by JS -->
  </div>

  <!-- QUICK REPLIES BAR -->
  <div class="quick-replies-bar" id="quick-replies-bar">
    <!-- populated by JS -->
  </div>

  <!-- IMAGE PREVIEW -->
  <div class="img-preview-wrap" id="img-preview-wrap">
    <div class="img-preview-inner">
      <img id="img-preview" src="" alt="preview" />
      <div>
        <div style="font-size:12px;color:var(--accent);margin-bottom:4px">🔬 Gửi ảnh để AI chẩn đoán</div>
        <button class="btn-remove-img" onclick="removeImage()">✕</button>
      </div>
    </div>
  </div>

  <!-- INPUT AREA -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="Hỏi về cá cảnh, bệnh, hồ lọc..."
        rows="1"
        onkeydown="handleKeyDown(event)"
        oninput="autoResize(this)"
      ></textarea>
      <div class="input-actions">
        <button class="btn-attach" title="Gửi ảnh cá bệnh để AI chẩn đoán">
          📷
          <input type="file" accept="image/*" onchange="handleImageUpload(event)" />
        </button>
        <button class="btn-send" id="send-btn" onclick="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2" fill="white" stroke="none"></polygon>
          </svg>
        </button>
      </div>
    </div>
    <div class="input-hint">
      Powered by Gemini AI ·
      <a href="https://saigoncacanh.com" target="_blank">saigoncacanh.com</a>
    </div>
  </div>
</div>



<!-- Scripts -->
<script src="knowledge-base.js?v=9.9.9"></script>
<script src="products.js?v=9.9.9"></script>
<script src="chatbot.js?v=9.9.9"></script>

</body>
</html>
